<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="description" content="Arash Souzani — Digital NFC Profile" />
  <title>Arash Souzani | آرش سوزنی</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="noise"></div>
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>

  <header class="topbar">
    <button id="langBtn" class="mini-btn" aria-label="Change language">EN</button>
    <button id="themeBtn" class="mini-btn icon-btn" aria-label="Toggle theme">
      <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
      <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5 8.5 8.5 0 1 0 20.5 14.4Z"/></svg>
    </button>
  </header>

  <main class="shell">
    <section class="card hero">
      <img class="lion-sun-watermark" src="lion-sun-gold.svg" alt="" aria-hidden="true" />

      <div class="photo-wrap">
        <img src="profile.jpg" alt="Arash Souzani" class="profile" />
        <span class="status-dot" title="Online profile"></span>
      </div>

      <div class="identity">
        <h1 data-fa="آرش سوزنی" data-en="ARASH SOUZANI">آرش سوزنی</h1>
      </div>

      <div class="socials" aria-label="Social links">
        <a class="social instagram" href="https://www.instagram.com/arash_srzzz/" target="_blank" rel="noopener" aria-label="Main Instagram">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
          <span data-fa="اینستاگرام" data-en="Instagram">اینستاگرام</span><small>Main</small>
        </a>
        <a class="social instagram" href="https://www.instagram.com/alexjonpvv/" target="_blank" rel="noopener" aria-label="Private Instagram">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1"/></svg>
          <span>PV</span><small>Instagram</small>
        </a>
        <a class="social telegram" href="https://t.me/Alexjoni" target="_blank" rel="noopener" aria-label="Telegram">
          <svg viewBox="0 0 24 24"><path d="M21 4 3.8 10.6c-1.2.5-1.2 1.2-.2 1.5l4.4 1.4 1.7 5.1c.2.6.1.8.7.8.5 0 .7-.2 1-.5l2.1-2 4.5 3.3c.8.5 1.4.3 1.6-.8L22.4 6c.3-1.4-.5-2.1-1.4-2Z"/></svg>
          <span>Telegram</span><small>@Alexjoni</small>
        </a>
        <a class="social whatsapp" href="https://wa.me/989033057473" target="_blank" rel="noopener" aria-label="WhatsApp">
          <svg viewBox="0 0 24 24"><path d="M20.5 3.5A11 11 0 0 0 3.2 16.7L2 22l5.4-1.2A11 11 0 1 0 20.5 3.5Zm-8.5 16a8.4 8.4 0 0 1-4.3-1.2l-.3-.2-3.2.7.7-3.1-.2-.3A8.5 8.5 0 1 1 12 19.5Z"/><path d="M9.2 7.6c-.2-.5-.4-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.4-1 1.1-1 2.6s1 2.9 1.2 3.1c.2.2 2.1 3.3 5.2 4.5 2.6 1 3.1.8 3.7.7.6-.1 1.9-.8 2.2-1.5.3-.7.3-1.3.2-1.5-.1-.1-.4-.2-.9-.5l-2.1-1c-.4-.1-.7-.2-1 .2l-.9 1.1c-.2.3-.5.3-.9.1-1.2-.6-2.2-1.3-3-2.4-.2-.4 0-.6.2-.8l.6-.7c.2-.2.2-.4.3-.6.1-.2 0-.5 0-.7l-.9-2.2Z"/></svg>
          <span>WhatsApp</span><small>Chat</small>
        </a>
        <a class="social message" href="sms:+989033057473" aria-label="Message">
          <svg viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 3v-4.5A2 2 0 0 1 3 15V7a2 2 0 0 1 2-2Z"/><path d="M7 10h10M7 14h6"/></svg>
          <span data-fa="پیام" data-en="Message">پیام</span><small>SMS</small>
        </a>
      </div>

      <div class="actions">
        <a class="primary" href="tel:+989033057473">
          <svg viewBox="0 0 24 24"><path d="M6.6 10.8a15.5 15.5 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.7 3.6.7.6 0 1 .4 1 1V20c0 .6-.4 1-1 1C10.6 21 3 13.4 3 4c0-.6.4-1 1-1h3.4c.6 0 1 .4 1 1 0 1.3.2 2.5.7 3.6.1.4 0 .8-.2 1l-2.3 2.2Z"/></svg>
          <span data-fa="تماس" data-en="Call">تماس</span>
        </a>
        <button class="secondary" id="saveContact">
          <svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>
          <span data-fa="ذخیره مخاطب" data-en="Save contact">ذخیره مخاطب</span>
        </button>
      </div>
    </section>

    <section class="card contact-card">
      <div class="section-title">
        <span data-fa="اطلاعات تماس" data-en="Contact">اطلاعات تماس</span>
        <span class="line"></span>
      </div>

      <a href="tel:+989033057473" class="contact-row">
        <span class="label" data-fa="شماره اصلی" data-en="Primary phone">شماره اصلی</span>
        <b dir="ltr">0903 305 7473</b>
      </a>
      <a href="tel:+989103805351" class="contact-row">
        <span class="label" data-fa="شماره دوم" data-en="Second phone">شماره دوم</span>
        <b dir="ltr">0910 380 5351</b>
      </a>
    </section>

    <section class="card clock-card">
      <div>
        <span class="label" data-fa="زمان محلی شما" data-en="Your local time">زمان محلی شما</span>
        <div id="time">--:--:--</div>
      </div>
      <div id="date">—</div>
    </section>

    <footer><span>ARASH SOUZANI</span></footer>
  </main>

  <div class="toast" id="toast" data-fa="فایل مخاطب آماده شد" data-en="Contact ready">فایل مخاطب آماده شد</div>
  <script src="script.js"></script>
</body>
</html>
